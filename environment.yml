name: coconut_mapping
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- Python ---
  - python=3.11

  # --- Core scientific ---
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - scikit-image        # skimage — required on Windows (rasterio/torchvision dep chain)

  # --- Geospatial ---
  - rasterio
  - geopandas
  - shapely
  - pyproj
  - fiona
  - gdal

  # --- Visualization ---
  - matplotlib
  - tqdm

  # --- Deep Learning ---
  # pytorch-cuda=12.4 is the latest stable build; works fine on CUDA 13.x drivers
  - pytorch
  - torchvision
  - pytorch-cuda=12.4

  # --- Utilities ---
  - pip
  - pip:
      - planetary-computer
      - pystac-client
      - tenacity
      - requests
